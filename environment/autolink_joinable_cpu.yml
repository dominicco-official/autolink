# JoinABLe upstream environment_cpu.yml does not pin cpuonly and resolves to CUDA builds + an MKL too new for torch 1.8 on Windows.
# This file pins what actually worked (see docs/setup_windows.md). pysdf needs MSVC Build Tools and an '#include <chrono>' patch (0.1.9).
name: autolink
channels: [pytorch, rusty1s, conda-forge]
dependencies:
  - python=3.7
  - pip
  - pytorch=1.8.1=py3.7_cpu_0
  - torchvision=0.9.1=py37_cpu
  - cpuonly
  - pytorch-geometric=1.7.2=py37_torch_1.8.0_cpu
  - pytorch-scatter=2.0.8=py37_torch_1.8.0_cpu
  - pytorch-sparse=0.6.12=py37_torch_1.8.0_cpu
  - pytorch-cluster=1.5.9=py37_torch_1.8.0_cpu
  - pytorch-spline-conv=1.2.1=py37_torch_1.8.0_cpu
  - pytorch-lightning=1.3.7
  - torchmetrics=0.4.0
  - mkl=2021.4
  - intel-openmp=2021.4
  - matplotlib
  - tqdm
  - networkx
  - scipy
  - scikit-learn
  - igl
  - meshplot
  - pip:
      - pillow==9.5.0
      - trimesh==3.23.5
      - rtree
      # pysdf==0.1.9 : build from sdist after adding '#include <chrono>' to src/util.cpp (needs MSVC Build Tools)
