<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AutoLink demo</title>
<style>
:root{--bg:#0f1216;--panel:#171b21;--line:#2a313b;--txt:#e6e9ee;--mut:#8b94a3;--acc:#4ea1ff;--ok:#38c172;--warn:#f0a42c;--pred:#ff4fa3;--gt:#38c172}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:1fr 380px;grid-template-areas:"top top" "steps steps" "view side"}
header{grid-area:top;display:flex;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:600}select,button,input{font:inherit;background:#0c0f13;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.primary{background:var(--acc);border-color:var(--acc);color:#04111f;font-weight:600}button:disabled{opacity:.4;cursor:default}
#steps{grid-area:steps;display:flex;align-items:center;gap:0;padding:10px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#0c0f13;white-space:nowrap;cursor:pointer;color:var(--mut)}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:12px;font-weight:600;color:var(--txt)}
.step.done{color:var(--txt)}.step.done .n{background:var(--ok);color:#04110a}.step.cur{border-color:var(--acc);color:var(--txt);box-shadow:0 0 0 2px #4ea1ff33}.step.cur .n{background:var(--acc);color:#04111f}
.arrow{color:var(--mut);padding:0 6px}.step small{color:var(--mut);font-size:11px}
#view{grid-area:view;position:relative;min-height:0}#view canvas{display:block}
#legend{position:absolute;left:12px;bottom:12px;background:#0c0f13cc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--mut)}
#legend span{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
#hud{position:absolute;left:12px;top:12px;background:#0c0f13cc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;max-width:60%}
#side{grid-area:side;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 16px}
#side h2{font-size:14px;margin:0 0 8px;color:var(--acc)}#side h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:16px 0 6px}
pre{background:#0c0f13;border:1px solid var(--line);border-radius:6px;padding:8px;font-size:11.5px;overflow:auto;max-height:260px;white-space:pre-wrap}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:500}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:var(--line)}.pill.ok{background:#1d4d33;color:#9be6b8}.pill.bad{background:#5a2323;color:#ffb3b3}.pill.pred{background:#5a1f3c;color:#ffb3d9}.pill.gt{background:#1d4d33;color:#9be6b8}
.param{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;margin:6px 0}.param label{font-size:12px}.param input{width:100%;padding:4px 6px}.param.dep input{background:#1f2a1f;border-color:#2e5b3a}.param .eq{grid-column:1/3;font-size:11px;color:var(--ok)}
.muted{color:var(--mut)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cand{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:6px 0;cursor:pointer}.cand.sel{border-color:var(--acc)}
.statline{font-size:12px;color:var(--mut);margin-top:6px}
</style></head><body>
<header><h1>AutoLink</h1><span class="muted">joint set</span><select id="jsSel"></select><input id="jsSearch" list="jsAll" placeholder="any test-split id, e.g. joint_set_00899" style="width:230px"><datalist id="jsAll"></datalist><button id="jsLoad">Load</button><span id="jsInfo" class="muted"></span>
<span style="flex:1"></span><button id="back">&larr; Back</button><button id="next" class="primary">Next &rarr;</button></header>
<div id="steps"></div>
<div id="view"><div id="hud"></div><div id="legend"></div></div>
<aside id="side"></aside>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three'; import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=s=>document.querySelector(s); const api=async(u,o)=>{const r=await fetch(u,o);const j=await r.json();if(j.error)throw new Error(j.error+"\n"+(j.trace||''));return j};
const STEPS=[{k:'dataset',t:'Dataset pair',s:'two meshes, apart'},{k:'s1',t:'1 JoinABLe',s:'which faces mate'},{k:'s2',t:'2 Reconstruct',s:'LLM -> CadQuery'},{k:'s3',t:'3 Verify',s:'rebuild == dataset?'},{k:'s4',t:'4 Classify',s:'rule table'},{k:'s5',t:'5 Place',s:'solver + contact'},{k:'s6',t:'6 Relations',s:'constraint graph'},{k:'s7',t:'7 Edit',s:'change a parameter'}];
let cur=0, js=null, info=null, steps=null, meshes={1:null,2:null}, geo={1:null,2:null}, raw={1:null,2:null}, rebuilt={1:null,2:null}, live=null, selCand=null;
// ---------- three.js ----------
const view=$('#view'); const renderer=new THREE.WebGLRenderer({antialias:true}); view.appendChild(renderer.domElement);

(function loop(){requestAnimationFrame(loop);ctl.update();renderer.render(scene,cam)})();
const C={body1:new THREE.Color(0x4a78b5),body2:new THREE.Color(0xb8bec8),pred:new THREE.Color(0xff4fa3),gt:new THREE.Color(0x38c172),both:new THREE.Color(0xffa94d)};
function makeGeo(m){const g=new THREE.BufferGeometry();const v=new Float32Array(m.triangles.length*9),c=new Float32Array(m.triangles.length*9);let i=0;for(const t of m.triangles){for(const k of t){const p=m.vertices[k];v[i]=p[0];v[i+1]=p[1];v[i+2]=p[2];i+=3}}g.setAttribute('position',new THREE.BufferAttribute(v,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));g.computeVertexNormals();g.userData.triFace=m.tri_face;return g}

function setT(k,T){const m=meshes[k];if(!m)return;if(!T){m.matrixAutoUpdate=true;m.position.set(0,0,0);m.rotation.set(0,0,0);m.updateMatrix();return}const M=new THREE.Matrix4();M.set(...T[0],...T[1],...T[2],...T[3]);m.matrixAutoUpdate=false;m.matrix.copy(M)}
function apart(){ // show parts side by side along x
 const b1=new THREE.Box3().setFromObject(meshes[1]),b2=new THREE.Box3().setFromObject(meshes[2]);const s1=b1.getSize(new THREE.Vector3()),s2=b2.getSize(new THREE.Vector3());const gap=Math.max(s1.x,s2.x)*0.9+0.5;
 setT(1,null);setT(2,null);meshes[1].position.x=-gap/2-b1.min.x-s1.x/2+0;meshes[2].position.x=gap/2-b2.min.x-s2.x/2;meshes[1].updateMatrix();meshes[2].updateMatrix();meshes[1].matrixAutoUpdate=true;meshes[2].matrixAutoUpdate=true}
function fit(){const b=new THREE.Box3().setFromObject(grp);if(b.isEmpty())return;const c=b.getCenter(new THREE.Vector3()),r=b.getSize(new THREE.Vector3()).length()/2;cam.position.copy(c).add(new THREE.Vector3(1.2,-1.6,1.0).normalize().multiplyScalar(r*2.6));cam.near=r/100;cam.far=r*50;cam.updateProjectionMatrix();ctl.target.copy(c)}
function clearExtras(){while(extras.children.length)extras.remove(extras.children[0])}
function addAxis(o,d,len,color,parent){const a=new THREE.Vector3(...o),b=new THREE.Vector3(...d).normalize();const g=new THREE.BufferGeometry().setFromPoints([a.clone().addScaledVector(b,-len),a.clone().addScaledVector(b,len)]);const l=new THREE.Line(g,new THREE.LineBasicMaterial({color}));(parent||extras).add(l);const s=new THREE.Mesh(new THREE.SphereGeometry(len*0.03),new THREE.MeshBasicMaterial({color}));s.position.copy(a);(parent||extras).add(s)}
// ---------- UI ----------
function legend(items){$('#legend').innerHTML=items.map(([c,t])=>`<div><span style="background:${c}"></span>${t}</div>`).join('')}
function hud(h){$('#hud').innerHTML=h}
function renderSteps(){$('#steps').innerHTML=STEPS.map((s,i)=>`<div class="step ${i<cur?'done':''} ${i===cur?'cur':''}" data-i="${i}"><div class="n">${i<cur?'&#10003;':i}</div><div><div>${s.t}</div><small>${s.s}</small></div></div>${i<STEPS.length-1?'<span class="arrow">&rarr;</span>':''}`).join('');document.querySelectorAll('.step').forEach(e=>e.onclick=()=>go(+e.dataset.i));$('#back').disabled=cur===0;$('#next').disabled=cur===STEPS.length-1}
const recon=()=>info&&info.has_reconstruction; const hasScripts=()=>info&&info.has_part_scripts; let running=false, lastRun36='';
async function runStep1(){if(running)return;running=true;hud('<b>Step 1 - running JoinABLe live</b> (Python 3.7 env, CPU): loading checkpoint + the two graph files, scoring all face pairs...');const t0=performance.now();
 try{const r=await api('/api/run_step1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({joint_set:js})});steps=await api('/api/steps?id='+js);info.has_prediction=true;running=false;showS1(`live run: ${r.seconds}s server-side, ${((performance.now()-t0)/1000).toFixed(1)}s wall`)}
 catch(e){running=false;hud('<b>Step 1 failed</b><pre>'+esc(e.message)+'</pre>')}}
async function runSteps36(){if(running)return;running=true;hud('<b>Steps 3-6 - running live</b>: build CadQuery scripts, verify vs dataset, classify, solve candidate poses + score contact, parameter sensitivity, relations... (10-40 s)');const t0=performance.now();
 try{const r=await api('/api/run_steps',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({joint_set:js})});steps=r.steps;info.has_reconstruction=!!(S(7)&&S(7).output&&S(7).output['propagation.json']);rebuilt[1]=await api(`/api/rebuilt_mesh?id=${js}&part=1`);rebuilt[2]=await api(`/api/rebuilt_mesh?id=${js}&part=2`);live=null;running=false;lastRun36=`live run: ${r.seconds}s server-side`;go(cur)}

const liveBtn=label=>`<button id="liveBtn" style="margin-left:10px">${label}</button>`; const bindLive=fn=>{const b=$('#liveBtn');if(b)b.onclick=fn}; const S=n=>steps&&steps[Object.keys(steps).find(k=>k.startsWith('step'+n+'_'))];
const topk=()=>S(1)&&S(1).output['prediction_top10.json']; const cls=()=>S(4)&&S(4).output['joint_classification.json']; const gtSet=k=>{const s={};for(const e of info.gt_entities){if(e[0]==='BRepFace'&&k===1)s[e[1]]=1;if(e[2]==='BRepFace'&&k===2)s[e[3]]=1}return s};
async function loadJS(id){js=id;info=(await api('/api/joint_sets')).find(x=>x.joint_set===id);const d=await api('/api/joint_set?id='+id);info.gt_entities=d.gt_entities;info.gt_T1=d.gt_transform_one;info.gt_T2=d.gt_transform_two;info.faces={1:d.faces1,2:d.faces2};
 raw[1]=await api('/api/mesh?body='+d.body_one);raw[2]=await api('/api/mesh?body='+d.body_two);steps=await api('/api/steps?id='+id);rebuilt={1:null,2:null};live=null;selCand=null;

function go(i){cur=Math.max(0,Math.min(STEPS.length-1,i));renderSteps();clearExtras();const k=STEPS[cur].k;({dataset:showDataset,s1:showS1,s2:showS2,s3:showS3,s4:showS4,s5:showS5,s6:showS6,s7:showS7})[k]()}
function side(h){$('#side').innerHTML=h}
const fmt=x=>typeof x==='number'?(Math.abs(x)<1e-3&&x!==0?x.toExponential(2):+x.toFixed(5)):x;
// ---- views ----
function showDataset(){setMesh(1,raw[1]);setMesh(2,raw[2]);paint(1);paint(2);apart();fit();legend([['#4a78b5','part 1 (body_one)'],['#b8bec8','part 2 (body_two)']]);

 const rows=k=>info.faces[k].map(f=>`<tr><td>${f.ds_face}</td><td>${f.type.toLowerCase()}</td><td>${f.radius!=null?fmt(f.radius):''}</td><td>${fmt(f.area)}</td></tr>`).join('');
 side(`<h2>Dataset pair</h2><p class="muted">Each part is a mesh (for display) plus a graph file listing its B-Rep faces. The face list is what every later step works from.</p><h3>part 1 faces</h3><table><tr><th>#</th><th>type</th><th>radius</th><th>area</th></tr>${rows(1)}</table><h3>part 2 faces</h3><table><tr><th>#</th><th>type</th><th>radius</th><th>area</th></tr>${rows(2)}</table>`)}
function showS1(note){setMesh(1,raw[1]);setMesh(2,raw[2]);apart();if(!topk()){runStep1();return}const p=topk();const t=p.candidates[0];const hl1={},hl2={};const g1=gtSet(1),g2=gtSet(2);
 for(const f in g1)hl1[f]=C.gt;for(const f in g2)hl2[f]=C.gt;if(t.body_one.entity==='BRepFace')hl1[t.body_one.index]=g1[t.body_one.index]?C.both:C.pred;if(t.body_two.entity==='BRepFace')hl2[t.body_two.index]=g2[t.body_two.index]?C.both:C.pred;paint(1,hl1);paint(2,hl2);
 const L=1.2;const a1=t.body_one.axis_origin,d1=t.body_one.axis_direction,a2=t.body_two.axis_origin,d2=t.body_two.axis_direction;const g=new THREE.Group();extras.add(g);
 const ax1=new THREE.Group();ax1.position.copy(meshes[1].position);addAxis([a1.x,a1.y,a1.z],[d1.x,d1.y,d1.z],L,0xff4fa3,ax1);extras.add(ax1);const ax2=new THREE.Group();ax2.position.copy(meshes[2].position);addAxis([a2.x,a2.y,a2.z],[d2.x,d2.y,d2.z],L,0xff4fa3,ax2);extras.add(ax2);fit();
 legend([['#ff4fa3','JoinABLe top-1 face + axis'],['#38c172','designer ground truth'],['#ffa94d','both (hit)']]);
 hud(`<b>Step 1 - JoinABLe</b> (pretrained graph neural network). Reads the two face lists, scores every (face, face) pair, returns a ranking. Top-1: part1 ${t.body_one.entity}[${t.body_one.index}] ${t.body_one.geometry} &harr; part2 ${t.body_two.entity}[${t.body_two.index}] ${t.body_two.geometry}, p=${t.probability.toFixed(3)} <span class="muted">${note||(p.run?`computed ${p.run.when} in ${p.run.seconds}s`:'precomputed')}</span>${liveBtn('Re-run JoinABLe now')}`);bindLive(runStep1);
 side(`<h2>Step 1 - which faces mate?</h2><p class="muted">Tool: JoinABLe GNN, checkpoint last_run_0. Input: graph files only. Output: <code>prediction_top10.json</code>.</p><table><tr><th>#</th><th>part 1</th><th>part 2</th><th>p</th><th></th></tr>${p.candidates.map(c=>`<tr><td>${c.rank}</td><td>${c.body_one.entity==='BRepFace'?'face':'edge'} ${c.body_one.index} <span class="muted">${c.body_one.geometry}</span></td><td>${c.body_two.entity==='BRepFace'?'face':'edge'} ${c.body_two.index} <span class="muted">${c.body_two.geometry}</span></td><td>${c.probability.toFixed(3)}</td><td>${(gtSet(1)[c.body_one.index]&&gtSet(2)[c.body_two.index]&&c.body_one.entity==='BRepFace'&&c.body_two.entity==='BRepFace')?'<span class="pill gt">hit</span>':''}</td></tr>`).join('')}</table><p class="statline">Probabilities are a softmax over all ${p.body_one_nodes}&times;${p.body_two_nodes} node pairs, so they look small; rank is what matters. Ground truth is shown only to check, never used downstream.</p>`)}
function showS2(){setMesh(1,raw[1]);setMesh(2,raw[2]);apart();fit();legend([['#4a78b5','part 1'],['#b8bec8','part 2']]);const s=S(2);
 const warn = recon() ? '' : hasScripts() ? '<span style="color:var(--warn)">No verified rebuild yet.</span> Scripts exist: press Next to run steps 3-6 live.' : '<span style="color:var(--warn)">No CadQuery script yet.</span> <button id="llmBtn">Run LLM reconstruction' + (TS&&TS.llm_provider?' ('+TS.llm_provider+(TS.llm_model?' / '+TS.llm_model:'')+')':' (no provider configured)') + '</button> <button id="reqBtn">Request from the agent</button> <span class="muted">' + (info.reconstruction_requested ? 'request pending: the agent writes recon/recon_' + js.split('_').pop() + '/part_N.py, then press Next' : '') + '</span>';

     hud(`<b>Step 2 done</b> (${r.provider}, ${r.seconds}s): part 1 ${r.results.part_1.success?'PASS':'FAIL'} in ${r.results.part_1.attempts} attempt(s), part 2 ${r.results.part_2.success?'PASS':'FAIL'} in ${r.results.part_2.attempts}. ${info.has_part_scripts?'Press Next to run steps 3-6 live.':'See recon/recon_'+js.split('_').pop()+'/attempts/ for the verifier reports.'}`);}
   catch(e){running=false;hud('<b>Step 2 failed</b><pre>'+esc(e.message)+'</pre>')}};
 const rb=$('#reqBtn');if(rb)rb.onclick=async()=>{await api('/api/request_reconstruction',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({joint_set:js})});info.reconstruction_requested=true;showS2()};
 side(`<h2>Step 2 - rebuild as CadQuery</h2><p class="muted">Tool: LLM. This is the text it reads:</p><h3>input: part_1_face_summary.txt</h3><pre>${esc(s.input['part_1_face_summary.txt'])}</pre><h3>input: part_2_face_summary.txt</h3><pre>${esc(s.input['part_2_face_summary.txt'])}</pre>`+(recon()?`<h3>output: part_1.py</h3><pre>${esc(s.output['part_1.py'])}</pre><h3>output: part_2.py</h3><pre>${esc(s.output['part_2.py'])}</pre>`:`<h3>output</h3><p class="muted">${esc(s.output['NOT_RECONSTRUCTED.txt']||'')}</p>`))}
const verified=()=>S(3)&&S(3).output&&S(3).output['verify_part_1.json'];
function needRecon(n){if(verified()&&!recon()){const v1=S(3).output['verify_part_1.json'],v2=S(3).output['verify_part_2.json'];hud(`<b>Step ${n}</b> not run: reconstruction failed verification in step 3 (part 1 ${pill(v1.PASS)}, part 2 ${pill(v2?v2.PASS:false)}). ${esc(S(3).output['STOPPED.txt']||'')}`);side(`<h2>Step ${n}</h2><p class="muted">Stopped after step 3 for ${js}. Fix recon/recon_${js.split('_').pop()}/part_N.py (or re-run the LLM) and press "Re-run steps 3-6".</p>${liveBtn('Re-run steps 3-6 now')}`);bindLive(runSteps36);return}
 if(hasScripts()&&!running){runSteps36();return}hud(`<b>Step ${n}</b> needs a CadQuery reconstruction. Go back to step 2 and request one.`);side(`<h2>Step ${n}</h2><p class="muted">Not available for ${js}: no CadQuery scripts in recon/recon_${js.split('_').pop()}/ yet.</p>`);}
